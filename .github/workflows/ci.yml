name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # tkinter nao vem no python do setup-python em Linux, e os testes de UI
      # precisam de um X server. Sem isso eles se auto-pulam e a cobertura cai.
      - name: Instalar tkinter e Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: Lint
        run: python -m pyflakes port_killer.py tests/

      - name: Testes (Linux, sob Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Testes
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      # Valida o item que nao da para verificar em outro SO: o AppImage so
      # compila se o icone referenciado pelo .desktop existir no AppDir.
      - name: Instalar appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libfuse2
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: portkiller-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
            dist/PortKiller
          if-no-files-found: warn
